<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Holographic Chat Background</title>
  <style>
    :root {
      color-scheme: dark;
      --cyan: #55e6ff;
      --violet: #9a4dff;
      --deep: #020716;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--deep);
    }
    body {
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
    }
    .chat {
      position: relative;
      width: min(100vw, calc(100vh * 0.5627));
      height: min(100vh, calc(100vw * 1.7771));
      overflow: hidden;
      background:
        linear-gradient(rgba(2, 8, 24, .25), rgba(2, 5, 18, .5)),
        url("./holographic-chat-base.png") center / 100% 100% no-repeat;
      isolation: isolate;
    }
    .chat::before {
      content: "";
      position: absolute;
      inset: -25% -15%;
      background:
        radial-gradient(ellipse at 8% 42%, rgba(42, 218, 255, .18), transparent 22%),
        radial-gradient(ellipse at 93% 63%, rgba(169, 62, 255, .16), transparent 24%);
      filter: blur(18px);
      animation: breathe 4s ease-in-out infinite;
      pointer-events: none;
    }
    .scan {
      position: absolute;
      z-index: 3;
      left: 6%;
      right: 6%;
      height: 18%;
      top: -22%;
      opacity: .32;
      background: linear-gradient(transparent, rgba(83, 218, 255, .20), transparent);
      filter: blur(12px);
      animation: scan 5.8s linear infinite;
      pointer-events: none;
    }
    .wave {
      position: absolute;
      z-index: 4;
      top: 8%;
      bottom: 8%;
      width: 10%;
      opacity: .68;
      filter: blur(.5px) drop-shadow(0 0 7px currentColor);
      pointer-events: none;
    }
    .wave.left {
      left: 1.5%;
      color: var(--cyan);
      animation: waveL 4.2s ease-in-out infinite;
    }
    .wave.right {
      right: 1.5%;
      color: var(--violet);
      animation: waveR 4.7s ease-in-out infinite;
    }
    .wave::before {
      content: "";
      position: absolute;
      inset: 0;
      border-left: 2px solid currentColor;
      border-radius: 50%;
      mask: linear-gradient(transparent, #000 12%, #000 88%, transparent);
    }
    .spark {
      position: absolute;
      z-index: 5;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px 2px var(--cyan);
      animation: drift var(--duration) linear infinite, twinkle 1.8s ease-in-out infinite;
      animation-delay: var(--delay);
      left: var(--x);
      top: 105%;
      pointer-events: none;
    }
    .flicker {
      position: absolute;
      inset: 0;
      z-index: 2;
      box-shadow: inset 0 0 28px rgba(68, 218, 255, .18), inset 0 0 54px rgba(130, 51, 255, .12);
      animation: flicker 7s steps(1, end) infinite;
      pointer-events: none;
    }
    @keyframes breathe {
      0%, 100% { opacity: .62; transform: scale(.99); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    @keyframes scan {
      to { transform: translateY(780%); }
    }
    @keyframes waveL {
      0%, 100% { transform: translateX(-7%) skewY(-4deg); opacity: .45; }
      50% { transform: translateX(13%) skewY(5deg); opacity: .8; }
    }
    @keyframes waveR {
      0%, 100% { transform: translateX(8%) skewY(4deg); opacity: .5; }
      50% { transform: translateX(-14%) skewY(-5deg); opacity: .85; }
    }
    @keyframes drift {
      to { transform: translateY(-125vh) translateX(18px); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: .15; }
      50% { opacity: .9; }
    }
    @keyframes flicker {
      0%, 14%, 16%, 48%, 50%, 78%, 80%, 100% { opacity: 1; }
      15%, 49%, 79% { opacity: .72; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="chat" aria-label="Animated holographic chat background">
    <div class="scan"></div>
    <div class="wave left"></div>
    <div class="wave right"></div>
    <div class="flicker"></div>
    <i class="spark" style="--x:10%;--duration:8s;--delay:-2s"></i>
    <i class="spark" style="--x:18%;--duration:11s;--delay:-7s"></i>
    <i class="spark" style="--x:32%;--duration:9s;--delay:-4s"></i>
    <i class="spark" style="--x:68%;--duration:12s;--delay:-6s"></i>
    <i class="spark" style="--x:83%;--duration:10s;--delay:-1s"></i>
    <i class="spark" style="--x:91%;--duration:13s;--delay:-9s"></i>
  </main>
</body>
</html>
